[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steamtool-cli"
description = "Read-only Steam wishlist, library and game query CLI for Linux/WSL"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version", "dependencies"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Environment :: Console",
]

[project.scripts]
steamtool = "steamtool.main:main"
teamtool = "steamtool.main:main"
Steamtool = "steamtool.main:main"

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.dynamic]
version = {attr = "steamtool.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["steamtool*", "schema*"]
namespaces = false

[tool.setuptools.package-data]
steamtool = ["resources/env.example"]
